name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # sslmode=disable: the local postgres service does not support TLS, and db.ts
  # enables client-side SSL for production builds unless the URL carries sslmode.
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/slnews_test?sslmode=disable"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_b3B0aW1hbC1zaGVwaGVyZC01OTE5LmNsZXJrLmFjY291bnRzLmRldiQ"
  # The secret half of the same Clerk instance, from the repository secrets. Never
  # inline it: this file is public, the value is a credential, and a key committed
  # here is burned the moment it lands (this line used to carry one, which is why
  # the e2e job started failing with a Clerk handshake loop once that key was
  # rotated). The publishable key above is public by design.
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
  NEXTAUTH_SECRET: "ci-test-secret-not-for-production"
  NEXTAUTH_URL: "http://localhost:3000"

# Every job resolves Node from `engines.node` in package.json
# (`node-version-file`), NOT from a hard-coded version. That field is also what
# Vercel reads to pick the runtime, so CI and production are guaranteed to run
# the same major — previously CI pinned 20 while the repo declared 22 in .nvmrc
# and production used Vercel's default, so the gate was testing a version nobody
# shipped. `.nvmrc` stays for nvm/fnm users and must be kept in step.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # Critical production advisories block the gate; high ones do not. A newly
      # published *high* advisory in a transitive dependency has no patch to apply
      # and no relation to the PR, yet it turned master red for every open PR with
      # no code change at all - three times in four days (#87, #89). Those are
      # tracked by the scheduled `dependency-audit` workflow instead, which files
      # one issue. Dev-only advisories still do not ship.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run test:coverage

  typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: slnews_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  e2e:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: slnews_test
          # Trust auth: localhost-only CI database, no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      # The feed, articles, and announcements pages read the database — the
      # schema and seed data must exist or e2e sees empty pages.
      - run: npx prisma db push
      - run: npx tsx prisma/seed.ts
      - run: npm run test:e2e
